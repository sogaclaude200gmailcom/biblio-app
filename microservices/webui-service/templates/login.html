{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
    <div class="auth-split">
        <div class="auth-photo" style="background-image:url('https://images.unsplash.com/photo-1622371729389-f18a9d26a84a?fm=jpg&q=70&w=800&auto=format&fit=crop')"></div>
        <div class="auth-form-side">
            <h2>Connexion</h2>
            <form method="POST" class="auth-form">
                <label>Nom d'utilisateur
                    <input type="text" name="username" required>
                </label>
                <label>Mot de passe
                    <input type="password" name="password" required>
                </label>
                <button type="submit">Se connecter</button>
            </form>
            <p style="margin-top:1.2rem;">Pas encore de compte ? <a href="{{ url_for('register') }}">Créez-en un</a>.</p>
        </div>
    </div>
{% endblock %}
